<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg:#10242b; --card:#17333b; --text:#e8f1ee; --muted:#8fa8a8; --accent:#6fd1b0; }
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Noto Nastaliq Urdu", sans-serif; }
    .next { text-align: center; padding: 6px 0 14px; }
    .next .label { color: var(--muted); font-size: 13px; }
    .next .name { font-size: 22px; margin: 2px 0; }
    .next .count { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
    .city { color: var(--muted); font-size: 12px; text-align: center; margin-bottom: 8px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; }
    li.active { background: var(--card); box-shadow: inset 3px 0 0 var(--accent); }
    li .en { color: var(--muted); font-size: 12px; margin-left: 8px; }
    li .time { font-variant-numeric: tabular-nums; }
    details { margin-top: 12px; border-top: 1px solid #26454d; padding-top: 10px; }
    summary { cursor: pointer; color: var(--muted); }
    label { display: block; margin: 8px 0 3px; font-size: 12px; color: var(--muted); }
    input, select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #26454d; background: var(--card); color: var(--text); font: inherit; }
    button { margin-top: 12px; width: 100%; padding: 9px; border: 0; border-radius: 6px; background: var(--accent); color: #0b1d22; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #msg { margin-top: 8px; min-height: 18px; font-size: 12px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="next">
    <div class="label">اگلی نماز</div>
    <div class="name" id="nextName">--</div>
    <div class="count" id="count">--:--:--</div>
  </div>
  <div class="city" id="city"></div>
  <ul id="list"></ul>

  <details>
    <summary>Settings</summary>
    <label for="city_in">Shehar (English mein)</label>
    <input id="city_in">
    <label for="country_in">Country</label>
    <input id="country_in">
    <label for="method">Hisaab ka tareeqa</label>
    <select id="method">
      <option value="1">Karachi (Pakistan)</option>
      <option value="3">Muslim World League</option>
      <option value="2">ISNA (North America)</option>
      <option value="4">Umm al-Qura (Makkah)</option>
    </select>
    <label for="school">Asr</label>
    <select id="school">
      <option value="1">Hanafi (der se)</option>
      <option value="0">Shafi / Maliki / Hanbali</option>
    </select>
    <label for="before">Pehle yaad dehani</label>
    <select id="before">
      <option value="0">Sirf waqt par</option>
      <option value="5">5 minute pehle</option>
      <option value="10">10 minute pehle</option>
      <option value="15">15 minute pehle</option>
    </select>
    <button id="save">Save karein</button>
  </details>
  <div id="msg"></div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
